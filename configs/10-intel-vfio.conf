# Xorg override used only in VFIO mode.
# Forces the Ubuntu host to use the Intel iGPU after the NVIDIA GPU
# has been detached from the host and reserved for VM passthrough.

Section "Device"
    Identifier "Intel Graphics"

    # Use the generic modesetting driver for the Intel iGPU.
    Driver "modesetting"

    # PCI address of the Intel iGPU.
    # Obtained from lspci; 00:02.0 becomes PCI:0:2:0 in Xorg syntax.
    BusID "PCI:0:2:0"
EndSection
